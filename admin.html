<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টেলতরি অ্যাডমিন ড্যাশবোর্ড</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="padding: 30px;">

    <div class="header" style="border-radius: 12px; margin-bottom: 30px; background: var(--bg-card); padding: 20px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
        <h1 style="color: var(--emerald-primary); font-size: 1.8rem;"><i class="fa-solid fa-lock"></i> টেলতরি অ্যাডমিন ড্যাশবোর্ড</h1>
        <a href="index.html" class="submit-btn" style="width: auto; padding: 10px 20px; text-decoration: none;">ওয়েবসাইটে ফিরে যান</a>
    </div>

    <div class="stats-card" style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; margin-bottom: 30px; font-size: 1.2rem;">
        মোট অর্ডারের সংখ্যা: <b id="totalOrdersCount" style="color: var(--emerald-primary);">0</b> জন গ্রাহক
    </div>

    <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color);">
            <thead>
                <tr style="background: #1b3228; color: var(--emerald-primary);">
                    <th style="padding: 15px 20px; text-align: left;">অর্ডারের সময়</th>
                    <th style="padding: 15px 20px; text-align: left;">গ্রাহকের নাম</th>
                    <th style="padding: 15px 20px; text-align: left;">মোবাইল নাম্বার</th>
                    <th style="padding: 15px 20px; text-align: left;">ঠিকানা</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--text-muted);">লোড হচ্ছে...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('teltori_orders') || '[]');
            document.getElementById('totalOrdersCount').innerText = orders.length;
            const tbody = document.getElementById('ordersTableBody');
            
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--text-muted);">এখনো কোনো অর্ডার জমা হয়নি।</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(order => `
                <tr style="border-bottom: 1px solid var(--border-color);">
                    <td style="padding: 15px 20px;">${order.date}</td>
                    <td style="padding: 15px 20px;"><b>${order.name}</b></td>
                    <td style="padding: 15px 20px;">${order.phone}</td>
                    <td style="padding: 15px 20px;">${order.address}</td>
                </tr>
            `).join('');
        }
        loadOrders();
    </script>
</body>
</html>
